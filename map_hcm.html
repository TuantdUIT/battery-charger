<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trạm đổi pin TP.HCM</title>
<link href="https://cdn.jsdelivr.net/npm/@goongmaps/goong-js@1.0.9/dist/goong-js.css" rel="stylesheet">
<style>
  :root { --bg: #fff; --fg: #1d2530; --muted: #667085; --line: #e4e7ec; --accent: #1a9850; --accent-bg: #e8f5ec; --hover: #f4f6f8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, "Segoe UI", sans-serif; color: var(--fg); }
  #app { display: flex; height: 100%; }

  /* Sidebar trái */
  #sidebar { width: 320px; flex: none; display: flex; flex-direction: column; background: var(--bg); border-right: 1px solid var(--line); z-index: 3; }
  #sidebar header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  #sidebar .titlerow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
  #sidebar h1 { font-size: 16px; line-height: 24px; margin: 0; }
  .iconbtn { display: inline-flex; align-items: center; justify-content: center; height: 24px; width: 28px; padding: 0; border: 0; border-radius: 6px;
             background: transparent; color: var(--muted); cursor: pointer; flex: none; }
  .iconbtn:hover { background: var(--hover); color: var(--fg); }
  .iconbtn svg { height: 24px; width: 24px; }
  #sidebar { transition: margin-left .2s ease; }
  #sidebar.collapsed { margin-left: -320px; }
  #openbtn { display: none; position: absolute; top: 10px; left: 10px; z-index: 2; height: 36px; width: 36px; background: #fff; box-shadow: 0 1px 5px rgba(0,0,0,.3); }
  #openbtn svg { height: 24px; width: 24px; }
  #app.side-collapsed #openbtn { display: inline-flex; }
  #summary { font-size: 13px; color: var(--muted); }
  #search { width: 100%; margin-top: 10px; padding: 8px 10px; font-size: 14px; border: 1px solid var(--line); border-radius: 6px; }
  #search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #wardlist { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; flex: 1; }
  #wardlist li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 16px; cursor: pointer; font-size: 14px; border-left: 3px solid transparent; }
  #wardlist li:hover { background: var(--hover); }
  #wardlist li.active { background: var(--accent-bg); border-left-color: var(--accent); font-weight: 600; }
  #wardlist li.all { border-bottom: 1px solid var(--line); font-weight: 600; }
  #wardlist .n { font-size: 12px; color: var(--muted); background: var(--hover); padding: 1px 8px; border-radius: 10px; flex: none; }
  #wardlist li.active .n { background: #fff; color: var(--accent); }
  #empty { padding: 16px; color: var(--muted); font-size: 14px; display: none; }

  /* Bản đồ */
  #mapwrap { position: relative; flex: 1; min-width: 0; }
  #map { position: absolute; inset: 0; }

  /* Panel phải */
  #detail { position: absolute; top: 0; right: 0; bottom: 0; width: 340px; max-width: 100%; background: var(--bg); border-left: 1px solid var(--line);
            box-shadow: -2px 0 10px rgba(0,0,0,.12); z-index: 4; transform: translateX(100%); transition: transform .2s; overflow-y: auto; }
  #detail.open { transform: none; }
  #detail .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 16px; border-bottom: 1px solid var(--line); }
  #detail h2 { font-size: 16px; margin: 0; line-height: 1.35; }
  #detail .close { border: 0; background: var(--hover); width: 28px; height: 28px; border-radius: 50%; font-size: 16px; cursor: pointer; flex: none; }
  #detail dl { margin: 0; padding: 8px 16px 16px; }
  #detail dt { font-size: 12px; color: var(--muted); margin-top: 12px; }
  #detail dd { margin: 2px 0 0; font-size: 14px; word-break: break-word; }
  #detail .tag { display: inline-block; font-size: 12px; color: var(--accent); background: var(--accent-bg); padding: 2px 8px; border-radius: 10px; margin-top: 6px; }
  #detail a.btn { display: inline-block; margin: 4px 16px 20px; padding: 8px 14px; background: var(--accent); color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; }

  /* Nhập key */
  #keybox { position: absolute; inset: 0; z-index: 9; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; }
  #keybox form { background: #fff; padding: 20px; border-radius: 10px; width: 360px; max-width: 90vw; }
  #keybox input { width: 100%; padding: 8px; margin: 8px 0 12px; font-size: 14px; }
  #keybox button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
  #keybox small { color: #555; display: block; margin-top: 10px; }

  @media (max-width: 720px) {
    #sidebar { position: absolute; top: 0; bottom: 0; left: 0; width: 84%; max-width: 320px; box-shadow: 2px 0 10px rgba(0,0,0,.2); }
    #sidebar.collapsed { margin-left: 0; transform: translateX(-105%); box-shadow: none; }
    #sidebar { transition: transform .2s ease; }
    #detail { width: 100%; top: auto; height: 55%; border-left: 0; border-top: 1px solid var(--line); transform: translateY(100%); }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <div class="titlerow">
        <h1>Trạm đổi pin TP.HCM</h1>
        <button id="closebtn" class="iconbtn" type="button" aria-label="Đóng thanh bên" title="Đóng thanh bên"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button>
      </div>
      <div id="summary"></div>
      <input id="search" type="search" placeholder="Tìm phường/xã…" autocomplete="off" aria-label="Tìm phường/xã">
    </header>
    <ul id="wardlist"></ul>
    <div id="empty">Không tìm thấy phường/xã phù hợp.</div>
  </aside>

  <div id="mapwrap">
    <button id="openbtn" class="iconbtn" type="button" aria-label="Mở thanh bên" title="Mở thanh bên"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button>
    <div id="map"></div>
    <section id="detail" aria-live="polite"></section>
  </div>
</div>

<div id="keybox">
  <form id="keyform">
    <b>Nhập Goong Maptiles Key</b>
    <input id="keyinput" type="password" placeholder="Maptiles key" autocomplete="off" required>
    <button type="submit">Hiển thị bản đồ</button>
    <small>Key chỉ lưu trong trình duyệt của bạn (localStorage) và chỉ gửi tới Goong. Dùng key loại Maptiles, không phải API key.</small>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@goongmaps/goong-js@1.0.9/dist/goong-js.js"></script>
<script src="hcm_stations.js"></script>
<script src="config.js" onerror="void 0"></script>
<script>
  const KEY_STORE = 'goong_maptiles_key';
  const ALL = window.HCM_STATIONS;
  const WARDS = window.HCM_WARDS.features.map(f => f.properties);
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const getKey = () => { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } };
  const setKey = k => { try { localStorage.setItem(KEY_STORE, k); } catch (e) {} };

  // Bounds của các trạm trong từng phường/xã (dùng để bay tới cụm tủ, không phải bbox ranh giới)
  const wardBounds = {};
  for (const f of ALL.features) {
    const w = f.properties.ward; if (!w) continue;
    const [x, y] = f.geometry.coordinates, b = wardBounds[w];
    if (!b) wardBounds[w] = [x, y, x, y];
    else { b[0] = Math.min(b[0], x); b[1] = Math.min(b[1], y); b[2] = Math.max(b[2], x); b[3] = Math.max(b[3], y); }
  }
  const wardList = WARDS.slice().sort((a, b) => a.name.localeCompare(b.name, 'vi'));

  let map = null, mapReady = false, activeWard = '';

  /* ---------- Sidebar ---------- */
  function renderList() {
    const q = $('search').value.trim().toLowerCase();
    const items = wardList.filter(w => !q || w.name.toLowerCase().includes(q));
    const total = activeWard ? (wardList.find(w => w.name === activeWard) || {}).count : ALL.features.length;
    $('summary').textContent = activeWard
      ? activeWard + ': ' + total.toLocaleString('vi-VN') + ' trạm'
      : ALL.features.length.toLocaleString('vi-VN') + ' trạm · ' + WARDS.length + ' phường/xã';
    let html = '<li class="all' + (activeWard ? '' : ' active') + '" data-ward=""><span>Tất cả TP.HCM</span><span class="n">' +
      ALL.features.length.toLocaleString('vi-VN') + '</span></li>';
    for (const w of items) {
      html += '<li data-ward="' + esc(w.name) + '" class="' + (w.name === activeWard ? 'active' : '') + '"><span>' +
        esc(w.name) + '</span><span class="n">' + w.count + '</span></li>';
    }
    $('wardlist').innerHTML = html;
    $('empty').style.display = items.length ? 'none' : 'block';
  }

  $('wardlist').addEventListener('click', e => {
    const li = e.target.closest('li'); if (!li) return;
    selectWard(li.dataset.ward);
    if (isNarrow()) setSidebar(false);
  });
  $('search').addEventListener('input', renderList);

  function setSidebar(open) {
    $('sidebar').classList.toggle('collapsed', !open);
    $('app').classList.toggle('side-collapsed', !open);
    $('closebtn').setAttribute('aria-expanded', open);
    // cập nhật kích thước bản đồ khi khung thay đổi
    setTimeout(() => { if (mapReady) map.resize(); }, 230);
  }
  const isNarrow = () => window.matchMedia('(max-width: 720px)').matches;
  $('closebtn').addEventListener('click', () => setSidebar(false));
  $('openbtn').addEventListener('click', () => setSidebar(true));
  if (isNarrow()) setSidebar(false);

  function selectWard(name) {
    activeWard = name;
    closeDetail();
    renderList();
    if (!mapReady) return;
    const feats = name ? ALL.features.filter(f => f.properties.ward === name) : ALL.features;
    map.getSource('stations').setData({ type: 'FeatureCollection', features: feats });
    map.setFilter('ward-line', ['==', ['get', 'name'], name || '\u0000']);
    map.setFilter('ward-fill', ['==', ['get', 'name'], name || '\u0000']);
    if (name && wardBounds[name]) {
      const b = wardBounds[name];
      map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 80, maxZoom: 16, duration: 900 });
    } else {
      map.fitBounds(cityBounds, { padding: 40, duration: 900 });
    }
  }

  /* ---------- Panel chi tiết bên phải ---------- */
  function showDetail(p, coords) {
    const dir = /^https?:\/\//.test(p.direction) ? p.direction : '';
    $('detail').innerHTML =
      '<div class="head"><div><h2>' + esc(p.name) + '</h2>' + (p.ward ? '<span class="tag">' + esc(p.ward) + '</span>' : '') +
      '</div><button class="close" type="button" aria-label="Đóng">✕</button></div>' +
      '<dl><dt>Địa chỉ</dt><dd>' + esc(p.address) + '</dd>' +
      '<dt>Mã trạm</dt><dd>' + esc(p.code) + '</dd>' +
      '<dt>Loại</dt><dd>' + esc(p.category || 'Trạm đổi pin') + '</dd>' +
      '<dt>Hotline</dt><dd>' + (p.hotline ? '<a href="tel:' + esc(p.hotline) + '">' + esc(p.hotline) + '</a>' : '—') + '</dd>' +
      (p.hotline_xdv ? '<dt>Hotline dịch vụ</dt><dd><a href="tel:' + esc(p.hotline_xdv) + '">' + esc(p.hotline_xdv) + '</a></dd>' : '') +
      '<dt>Toạ độ</dt><dd>' + coords[1].toFixed(6) + ', ' + coords[0].toFixed(6) + '</dd></dl>' +
      (dir ? '<a class="btn" href="' + esc(dir) + '" target="_blank" rel="noopener">Chỉ đường</a>' : '');
    $('detail').classList.add('open');
    $('detail').querySelector('.close').addEventListener('click', closeDetail);
    if (mapReady) map.getSource('selected').setData({ type: 'Feature', geometry: { type: 'Point', coordinates: coords }, properties: {} });
  }
  function closeDetail() {
    $('detail').classList.remove('open');
    if (mapReady) map.getSource('selected').setData({ type: 'FeatureCollection', features: [] });
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

  /* ---------- Bản đồ ---------- */
  const cityBounds = (() => {
    let b = [Infinity, Infinity, -Infinity, -Infinity];
    for (const w of window.HCM_WARDS.features) { const bb = w.properties.bbox;
      b = [Math.min(b[0], bb[0]), Math.min(b[1], bb[1]), Math.max(b[2], bb[2]), Math.max(b[3], bb[3])]; }
    return [[b[0], b[1]], [b[2], b[3]]];
  })();

  function initMap(key) {
    goongjs.accessToken = key;
    map = new goongjs.Map({
      container: 'map',
      style: 'https://tiles.goong.io/assets/goong_map_web.json',
      bounds: cityBounds,
      fitBoundsOptions: { padding: 30 }
    });
    map.addControl(new goongjs.NavigationControl(), 'top-right');

    map.on('error', e => {
      const st = e && e.error && e.error.status;
      if (st === 401 || st === 403) { try { localStorage.removeItem(KEY_STORE); } catch (x) {} showKeyBox('Key không hợp lệ, vui lòng nhập lại.'); }
    });

    map.on('load', () => {
      map.addSource('wards', { type: 'geojson', data: window.HCM_WARDS });
      map.addLayer({ id: 'ward-outline', type: 'line', source: 'wards',
        paint: { 'line-color': '#8a94a6', 'line-width': 0.6, 'line-opacity': 0.5 } });
      map.addLayer({ id: 'ward-fill', type: 'fill', source: 'wards', filter: ['==', ['get', 'name'], '\u0000'],
        paint: { 'fill-color': '#1a9850', 'fill-opacity': 0.08 } });
      map.addLayer({ id: 'ward-line', type: 'line', source: 'wards', filter: ['==', ['get', 'name'], '\u0000'],
        paint: { 'line-color': '#1a9850', 'line-width': 2.5 } });

      map.addSource('stations', { type: 'geojson', data: ALL, cluster: true, clusterRadius: 45, clusterMaxZoom: 14 });
      map.addLayer({ id: 'clusters', type: 'circle', source: 'stations', filter: ['has', 'point_count'],
        paint: {
          'circle-color': ['step', ['get', 'point_count'], '#51bbd6', 50, '#f1a340', 200, '#e0457b'],
          'circle-radius': ['step', ['get', 'point_count'], 16, 50, 22, 200, 30],
          'circle-stroke-width': 2, 'circle-stroke-color': '#fff' } });
      map.addLayer({ id: 'cluster-count', type: 'symbol', source: 'stations', filter: ['has', 'point_count'],
        layout: { 'text-field': '{point_count_abbreviated}', 'text-size': 12 }, paint: { 'text-color': '#fff' } });
      map.addLayer({ id: 'point', type: 'circle', source: 'stations', filter: ['!', ['has', 'point_count']],
        paint: { 'circle-color': '#1a9850', 'circle-radius': 7, 'circle-stroke-width': 2, 'circle-stroke-color': '#fff' } });

      map.addSource('selected', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({ id: 'selected', type: 'circle', source: 'selected',
        paint: { 'circle-color': '#1a9850', 'circle-radius': 11, 'circle-stroke-width': 3, 'circle-stroke-color': '#ff7a00' } });

      mapReady = true;

      map.on('click', 'clusters', e => {
        const f = map.queryRenderedFeatures(e.point, { layers: ['clusters'] })[0];
        map.getSource('stations').getClusterExpansionZoom(f.properties.cluster_id, (err, zoom) => {
          if (!err) map.easeTo({ center: f.geometry.coordinates, zoom });
        });
      });
      map.on('click', 'point', e => {
        const f = e.features[0];
        const coords = f.geometry.coordinates.slice();
        showDetail(f.properties, coords);
        map.easeTo({ center: coords, zoom: Math.max(map.getZoom(), 15), duration: 500 });
      });
      ['clusters', 'point'].forEach(l => {
        map.on('mouseenter', l, () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', l, () => map.getCanvas().style.cursor = '');
      });

      if (activeWard) selectWard(activeWard);
    });
  }

  function showKeyBox(msg) {
    $('keybox').style.display = 'flex';
    if (msg) $('keybox').querySelector('b').textContent = msg;
  }
  $('keyform').addEventListener('submit', e => {
    e.preventDefault();
    setKey($('keyinput').value.trim());
    location.reload();
  });

  renderList();
  const key = window.GOONG_MAP_KEY || getKey();
  key ? initMap(key) : showKeyBox();
</script>
</body>
</html>
